name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  ENVIRONMENT: test
  OPENBLAS_NUM_THREADS: "1"
  # Never connected to by the test job or the gate job, the settings class only requires it.
  REDIS_URL: redis://localhost:6379/0

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: docdesk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the project
        run: python -m pip install -e ".[dev]"
      - name: Download the pinned embedding model
        run: python scripts/fetch_model.py
      - name: Create throwaway secrets for this run only
        run: |
          JWT=$(openssl rand -hex 32)
          RO_PW=$(openssl rand -hex 16)
          echo "::add-mask::$JWT"
          echo "::add-mask::$RO_PW"
          echo "JWT_SECRET=$JWT" >> "$GITHUB_ENV"
          echo "DATABASE_URL=postgresql+psycopg://postgres@localhost:5432/postgres" >> "$GITHUB_ENV"
          echo "TEST_DATABASE_URL=postgresql+psycopg://postgres@localhost:5432/docdesk_test" >> "$GITHUB_ENV"
          echo "READONLY_DATABASE_URL=postgresql+psycopg://docdesk_readonly:$RO_PW@localhost:5432/docdesk_test" >> "$GITHUB_ENV"
      - name: Lint and house rules
        run: |
          python -m ruff check .
          python scripts/check_file_length.py
          python scripts/check_docs_style.py
      - name: Tests
        run: python -m pytest

  retrieval-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: docdesk_gate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the project
        run: python -m pip install -e ".[dev]"
      - name: Download the pinned embedding model
        run: python scripts/fetch_model.py
      - name: Create a throwaway secret and the database url for this run only
        run: |
          JWT=$(openssl rand -hex 32)
          echo "::add-mask::$JWT"
          echo "JWT_SECRET=$JWT" >> "$GITHUB_ENV"
          echo "DATABASE_URL=postgresql+psycopg://postgres@localhost:5432/docdesk_gate" >> "$GITHUB_ENV"
      - name: Build the schema
        run: python -m alembic upgrade head
      - name: Retrieval gate on the small CI corpus (recall at 5 and MRR, no model call)
        run: python scripts/ci_gate.py
