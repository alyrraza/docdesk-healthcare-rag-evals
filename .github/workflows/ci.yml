name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  ENVIRONMENT: test
  OPENBLAS_NUM_THREADS: "1"
  # Never connected to by the test job or the gate job, the settings class only requires it.
  REDIS_URL: redis://localhost:6379/0

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: docdesk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install the project
        run: python -m pip install -e ".[dev]"
      - name: Download the pinned embedding model
        run: python scripts/fetch_model.py
      - name: Create throwaway secrets for this run only
        run: |
          JWT=$(openssl rand -hex 32)
          RO_PW=$(openssl rand -hex 16)
          echo "::add-mask::$JWT"
          echo "::add-mask::$RO_PW"
          echo "JWT_SECRET=$JWT" >> "$GITHUB_ENV"
          echo "DATABASE_URL=postgresql+psycopg://postgres@localhost:5432/postgres" >> "$GITHUB_ENV"
          echo "TEST_DATABASE_URL=postgresql+psycopg://postgres@localhost:5432/docdesk_test" >> "$GITHUB_ENV"
          echo "READONLY_DATABASE_URL=postgresql+psycopg://docdesk_readonly:$RO_PW@localhost:5432/docdesk_test" >> "$GITHUB_ENV"
      - name: Lint and house rules
        run: |
          python -m ruff check .
          python scripts/check_file_length.py
          python scripts/check_docs_style.py
      - name: Tests
        run: python -m pytest

  retrieval-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: docdesk_gate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install the project
        run: python -m pip install -e ".[dev]"
      - name: Download the pinned embedding model
        run: python scripts/fetch_model.py
      - name: Create a throwaway secret and the database url for this run only
        run: |
          JWT=$(openssl rand -hex 32)
          echo "::add-mask::$JWT"
          echo "JWT_SECRET=$JWT" >> "$GITHUB_ENV"
          echo "DATABASE_URL=postgresql+psycopg://postgres@localhost:5432/docdesk_gate" >> "$GITHUB_ENV"
      - name: Build the schema
        run: python -m alembic upgrade head
      - name: Retrieval gate on the small CI corpus (recall at 5 and MRR, no model call)
        run: python scripts/ci_gate.py

  build-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # Builds and smoke tests the image on every push and pull request. It never pushes.
    steps:
      - uses: actions/checkout@v6
      - name: Create a throwaway .env with random secrets for this run only
        run: python3 scripts/make_env.py
      - name: Build the image and start the compose stack, wait for health
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Health endpoint answers
        run: curl --fail --silent http://localhost:8000/health
      - name: Seed the 20 document fixture corpus (no model call)
        run: docker compose exec -T api python scripts/demo_seed.py
      - name: Retrieval smoke, the known rubella document must be in the top results
        run: >-
          docker compose exec -T api python scripts/demo_retrieve.py
          "How does rubella show up in someone who gets symptoms?"
          --expect seed:medlineplus:medlineplus-387
      - name: Show the stack logs when something failed
        if: failure()
        run: docker compose logs --no-color --tail 200

  image-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # Publishes only after the tests, the retrieval gate and the smoke all passed, on main.
    needs: [test, retrieval-gate, build-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Log in to ghcr.io with the workflow token
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build the image tagged with the commit and latest
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:latest" .
      - name: Push both tags
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"
