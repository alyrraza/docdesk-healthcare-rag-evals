[project]
name = "docdesk"
version = "0.1.0"
description = "Healthcare RAG service with a built-in evaluation harness"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.110,<1",
    "pydantic-settings>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4", "httpx>=0.27,<1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = ["integration: needs the real test database (TEST_DATABASE_URL)"]
