[project]
name = "docdesk"
version = "0.1.0"
description = "Healthcare RAG service with a built-in evaluation harness"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.110,<1",
    "psycopg[binary]>=3.1,<4",
    "sqlalchemy>=2,<3",
    "alembic>=1.13,<2",
    "pgvector>=0.3,<1",
    "argon2-cffi>=23,<26",
    "PyJWT>=2.8,<3",
    "pydantic-settings>=2.2,<3",
    "tokenizers>=0.19,<1",
    "onnxruntime>=1.17,<2",
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4", "httpx>=0.27,<1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["docdesk"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependencies are meant to be called in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Security", "fastapi.Query", "fastapi.File"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
    "integration: needs the real test database (TEST_DATABASE_URL)",
    "model: needs the ONNX model downloaded under .cache/models",
]
