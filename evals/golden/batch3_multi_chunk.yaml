- id: gi-035
  type: multi_chunk
  split: dev
  question: What most often causes infectious mononucleosis, and how is it diagnosed?
  answerable: true
  gold_route: documents
  gold_facts:
  - It is most often caused by the Epstein-Barr virus (EBV), though many viruses can cause it
  - A healthcare provider may diagnose it based on the symptoms and a physical exam
  gold_evidence:
  - source: seed:medlineplus:medlineplus-298
    text: What causes infectious mononucleosis (mono)? Mono can be caused by many different viruses. But it is most often caused by the Epstein-Barr virus (EBV).
  - source: seed:medlineplus:medlineplus-298
    text: How is infectious mononucleosis (mono) diagnosed? Your healthcare provider may diagnose mono based on your symptoms and a physical exam.
  verified: true
  verified_by: ali
  verified_on: 2026-10-14
- id: gi-036
  type: multi_chunk
  split: test
  question: What lasting damage can sarcoidosis cause, and can it be cured?
  answerable: true
  gold_route: documents
  gold_facts:
  - Over time it can cause permanent scarring of organs
  - There is no cure; the goal of treatment is remission
  gold_evidence:
  - source: seed:medlineplus:medlineplus-389
    text: Over time, sarcoidosis can cause permanent scarring of organs.
  - source: seed:medlineplus:medlineplus-389
    text: There is no cure for sarcoidosis. The goal of treatment for sarcoidosis is remission, which means you still have the condition, but it does not cause you problems.
  verified: true
  verified_by: ali
  verified_on: 2026-10-14
