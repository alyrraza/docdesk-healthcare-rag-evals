- id: gi-052
  type: multi_chunk
  split: test
  question: What does the phenytoin sodium injection label say about the maximum rate of intravenous administration, and which seizure emergency is the injection indicated for?
  answerable: true
  gold_route: documents
  gold_facts:
  - The rate of intravenous administration should not exceed 50 mg per minute in adults and 1 to 3 mg/kg/min (or 50 mg per minute, whichever is slower) in pediatric patients, because of the risk of severe hypotension and cardiac arrhythmias
  - It is indicated for generalized tonic-clonic status epilepticus, and for prevention and treatment of seizures occurring during neurosurgery
  gold_evidence:
  - source: seed:openfda:035a8d4e-2063-4240-83cb-d7eebcabe301
    text: The rate of intravenous Phenytoin Sodium Injection administration should not exceed 50 mg per minute in adults and 1 to 3 mg/kg/min (or 50 mg per minute, whichever is slower) in pediatric patients because of the risk of severe hypotension and cardiac arrhythmias.
  - source: seed:openfda:035a8d4e-2063-4240-83cb-d7eebcabe301
    text: Parenteral Phenytoin Sodium Injection is indicated for the treatment of generalized tonic-clonic status epilepticus, and prevention and treatment of seizures occurring during neurosurgery.
  verified: false
