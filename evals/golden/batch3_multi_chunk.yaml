  - Persons who have shown hypersensitivity to any of the tetracyclines
  gold_evidence:
  - source: seed:openfda:00b2aa98-dea2-90c3-e063-6294a90a35d6
    text: 'Doxycycline is indicated for the treatment of the following infections: Rocky Mountain spotted fever, typhus fever and the typhus group, Q fever, rickettsialpox, and tick fevers caused by Rickettsiae.'
  - source: seed:openfda:00b2aa98-dea2-90c3-e063-6294a90a35d6
    text: This drug is contraindicated in persons who have shown hypersensitivity to any of the tetracyclines.
  verified: false
