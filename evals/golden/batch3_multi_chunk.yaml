  split: dev
  question: What causes hemorrhoids, and how can they most often be treated at home?
  answerable: true
  gold_route: documents
  gold_facts:
  - Too much pressure on the veins around the anus
  - Eating high-fiber foods, taking a stool softener or fiber supplement, and drinking enough fluids
  gold_evidence:
