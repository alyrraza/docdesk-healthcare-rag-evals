    text: Hemorrhoids happen when there is too much pressure on the veins around the anus.
  - source: seed:medlineplus:medlineplus-1226
    text: 'You can most often treat your hemorrhoids at home by: - Eating foods that are high in fiber. - Taking a stool softener or a fiber supplement. - Drinking enough fluids every day.'
