- id: gi-038
  type: multi_chunk
  split: test
  question: What happens in mitral valve prolapse, and do most people who have it have symptoms?
  answerable: true
  gold_route: documents
  gold_facts:
  - The flaps of the mitral valve become floppy and do not close tightly
  - Most people who have it do not have any symptoms
  gold_evidence:
  - source: seed:medlineplus:medlineplus-1605
    text: Mitral valve prolapse (MVP) happens when the flaps of the mitral valve become floppy and don't close tightly.
  - source: seed:medlineplus:medlineplus-1605
    text: What are the symptoms of mitral valve prolapse (MVP)? Most people who have MVP don't have any symptoms.
  verified: true
  verified_by: ali
  verified_on: 2026-10-14
- id: gi-039
  type: multi_chunk
  split: dev
  question: What can cause sudden cardiac arrest, and how is it treated?
  answerable: true
  gold_route: documents
  gold_facts:
  - It can happen when the heart's electrical system is not working right and causes irregular heartbeats
  - It needs treatment with a defibrillator right away, a device that sends an electric shock to the heart
  gold_evidence:
  - source: seed:medlineplus:medlineplus-4266
    text: What causes sudden cardiac arrest (SCA)? Your heart has an electrical system that controls the rate and rhythm of your heartbeat. An SCA can happen when the heart's electrical system is not working right and causes irregular heartbeats.
  - source: seed:medlineplus:medlineplus-4266
    text: What are the treatments for sudden cardiac arrest (SCA)? SCA is an emergency. A person having SCA needs to be treated with a defibrillator right away. A defibrillator is a device that sends an electric shock to the heart.
  verified: true
  verified_by: ali
  verified_on: 2026-10-14
