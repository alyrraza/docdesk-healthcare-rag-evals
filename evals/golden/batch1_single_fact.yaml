  split: dev
  question: How does rubella show up in someone who gets symptoms?
  answerable: true
  gold_route: documents
  gold_facts:
  - A rash that starts on the face and spreads to the body
  - Mild fever
  - Aching joints, especially in young women
  - Swollen glands
  gold_evidence:
  - source: seed:medlineplus:medlineplus-387
    text: 'symptoms may include: - A rash that starts on the face and spreads to the body - Mild fever - Aching joints, especially in young women - Swollen glands'
  verified: true
