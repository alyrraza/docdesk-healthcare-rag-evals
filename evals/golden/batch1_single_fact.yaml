- id: gi-009
  type: single_fact
  split: dev
  question: How often are routine prenatal checkups scheduled over the course of a pregnancy?
  answerable: true
  gold_route: documents
  gold_facts:
  - Once a month for weeks 4 through 28
  - Twice a month for weeks 28 through 36
  - Weekly from week 36 until the baby is born
  gold_evidence:
  - source: seed:medlineplus:medlineplus-6
    text: 'Usually, visits during your pregnancy occur: - Once a month for weeks 4 through 28 - Twice a month for weeks 28 through 36 - Weekly for week 36 until your baby is born'
  verified: true
  verified_by: ali
  verified_on: 2026-10-14
