- id: gi-001
  type: single_fact
  split: dev
  question: How does rubella show up in someone who gets symptoms?
  answerable: true
  gold_route: documents
  gold_facts:
  - A rash that starts on the face and spreads to the body
  - Mild fever
  - Aching joints, especially in young women
  - Swollen glands
  gold_evidence:
  - source: seed:medlineplus:medlineplus-387
    text: 'symptoms may include: - A rash that starts on the face and spreads to the body - Mild fever - Aching joints, especially in young women - Swollen glands'
  verified: false
- id: gi-002
  type: single_fact
  split: test
  question: How far ahead can a ramipril capsule mixture be prepared, and how should it be kept?
  answerable: true
  gold_route: documents
  gold_facts:
  - It can be prepared ahead and kept up to 24 hours at room temperature
  - Or up to 48 hours under refrigeration
  gold_evidence:
  - source: seed:openfda:01da05d8-e72e-4208-bf92-a5cd929f15ab
    text: The described mixtures can be pre-prepared and stored for up to 24 hours at room temperature or up to 48 hours under refrigeration.
  verified: false
