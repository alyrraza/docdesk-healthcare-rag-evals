- id: gi-006
  type: single_fact
  split: dev
  question: What can happen when opioid painkillers are combined with benzodiazepine sedatives?
  answerable: true
  gold_route: documents
  gold_facts:
  - It may cause profound sedation, respiratory depression, coma and death
  gold_evidence:
  - source: seed:openfda:066e25b2-8a1b-4b08-b585-ce36753bf104
    text: Concomitant use of benzodiazepines and opioids may result in profound sedation, respiratory depression, coma, and death.
  verified: false
