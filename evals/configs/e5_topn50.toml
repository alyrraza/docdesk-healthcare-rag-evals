# Technique config e5_topn50, derived from b0.toml with these changes: retrieval.top_n=50.
# b0.toml is never edited. content_hash covers every value below.
id = "e5_topn50"
content_hash = "ebc4d9a8ae890c304be6c3440d40da35501d8d05bc4f027d3aede1f47b7154c1"

[chunking]
strategy = "recursive"
size = 200
overlap = 40

[embedding]
model = "sentence-transformers/all-MiniLM-L6-v2"
revision = "1110a243fdf4706b3f48f1d95db1a4f5529b4d41"

[retrieval]
mode = "dense"
top_n = 50
top_k = 5
rrf_k = 60

[rerank]
enabled = false

[packer]
max_per_document = 2

[budget]
total = 6000
system = 500
schema = 300
evidence = 4200
history = 0
question = 300
reserve = 700

[prompt]
name = "answer"
version = "1.0.0"
# sha256 of prompts/answer/answer.v1.md from the prompt loader; an edit must become a new version.
content_hash = "a0be1da5f9af465c4532837735edc804dda9199f1c66f104ca31c7f394cec14e"

[models]
generator = "openai/gpt-oss-120b"
judge = "qwen/qwen3.8-27b"
temperature = 0
max_output_tokens = 600

# Placeholder on purpose: T102a sets the threshold from the B0 dev score distribution.
[abstain]
threshold = 0.0
