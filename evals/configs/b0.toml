# Baseline B0, pinned 2026-10-13. Frozen after its first stored result (T097): a change means a
# new file with a new id (b1, b2), never an edit. content_hash covers every value below.
# Print it with: python -m docdesk.evals.config evals/configs/b0.toml
#
# OPEN ISSUE, found while writing this file: the corpus loaded so far was chunked with the
# "fixed" chunker, because IngestConfig() defaults to it and scripts/load_corpus.py uses that
# default. B0 as written in docs/modules/evals.md is "recursive". Before T097 the corpus must be
# re-ingested with "recursive", or this file must say "fixed". Decide it before the first result.
id = "b0"
content_hash = "fed9a01995b7949088a60ec32c5a095b5209a967683bf462fe9476eae9e4b26d"

[chunking]
strategy = "recursive"
size = 200
overlap = 40

[embedding]
model = "sentence-transformers/all-MiniLM-L6-v2"
revision = "1110a243fdf4706b3f48f1d95db1a4f5529b4d41"

[retrieval]
mode = "dense"
top_n = 20
top_k = 5
rrf_k = 60

[rerank]
enabled = false

[packer]
max_per_document = 2

[budget]
total = 6000
system = 500
schema = 300
evidence = 4200
history = 0
question = 300
reserve = 700

[prompt]
name = "answer"
version = "1.0.0"

[models]
generator = "openai/gpt-oss-120b"
judge = "qwen/qwen3.8-27b"
temperature = 0
max_output_tokens = 600

# Placeholder on purpose: T102a sets the threshold from the B0 dev score distribution.
[abstain]
threshold = 0.0
